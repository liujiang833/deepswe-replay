# ARM topdown 采集配置 —— 目标机上**只需要改这一个文件**。
#
# 为什么事件号要放在配置里而不是写进脚本：ARM PMUv3 只把一小部分事件号定为
# 架构必需，其余由各家核自己编号。Neoverse V1 / N2 / 自研核的 TRM 对不上是常态，
# 而事件号写错的表现是「有数、但数是别的东西」，不会报错。把它们隔离在这一个
# 文件里，换核只改配置，脚本一行不动。
#
# 格式约束（bash `source` 与 python 都要能读，所以两边的交集才合法）：
#   - 只写 KEY=VALUE，等号两边不留空格
#   - 值里有空格必须用引号包住（只有 EV_EXTRA 会用到）
#   - 注释用 #，可以整行，也可以跟在值后面
#   - 不要写 shell 展开（$(...) / ${VAR}）—— python 侧不认

# ── PMU ────────────────────────────────────────────────────────
# 留空 = 运行时自动探测：ls /sys/bus/event_source/devices/ | grep -m1 armv8
# 只有在异构核（big.LITTLE，会出现 armv8_pmuv3_0 / armv8_pmuv3_1 多个）
# 或者自动探测选错了的时候才需要手填。probe_pmu.sh 会列出全部候选。
PMU=

# ── SLOTS（每周期的 issue slot 数）─────────────────────────────
# ⚠️ 强烈建议留空。留空 = 运行时从 /sys/bus/event_source/devices/$PMU/caps/slots 读。
#
#    写死一个常数是本套脚本里最危险的一件事：SLOTS 是四象限公式的**公共分母**，
#    V1 是 8、N2 是 5、别的核又不一样。换机器（甚至同机换到另一簇核）之后，
#    分母错了，四个比值会一起按同一个比例静默偏移 —— 每一项看着都还在 0~1 之间，
#    像是「这台机器后端压力大一点」，但其实整套数都是错的，而且**不会报任何错**。
#
#    ⚠️ 兜底能力取决于下面的「后端口径」：
#      - 直接法（EV_STALL_SLOT_BE 填了）：靠「四象限求和 ≈ 1」这条自检兜住，
#        分母错了求和就不等于 1。
#      - 残差法（EV_STALL_SLOT_BE 留空）：求和恒等于 1，**那条自检失效**，
#        只剩 C1/C3 这两条不等式能抓「SLOTS 偏小」，抓不到「SLOTS 偏大」。
#        详见下面 EV_STALL_SLOT_BE 那一段。
#
#    真要手填，只在 caps/slots 这个文件不存在（老内核没导出）时才填，
#    并且必须以目标核的 TRM 为准。
SLOTS=

# ── 事件号的写法：必须带 0x 前缀 ───────────────────────────────
# 下面所有 EV_* 的事件号**必须**写成 0x 开头的十六进制（`0x003a`、`0x3a` 都行），
# 脚本会当场校验，不合格直接拒绝跑。
#
# 为什么要专门校验这件事：perf 的 `event=` 字段按 **C 风格**解析数字 ——
# 写 `11` 它读的是**十进制 11**，也就是事件 0xb（BR_MIS_PRED），
# 而你想要的 CPU_CYCLES 是 0x11。这个错误 perf **完全不报错**：
# 事件 0xb 是合法事件，照样有数，只是数的是别的东西。四象限于是整套错，
# 而且错得「看起来很正常」。所以宁可在启动时就拒绝，也不让它跑起来。

# ── L1 四象限必需的四个事件 ────────────────────────────────────
# 下面是 ARM PMUv3 **架构定义值**，多数 Neoverse 核直接适用；
# 上机前请按目标核 TRM 核对一遍（probe_pmu.sh 的活体验证也能替你兜住大部分错号）。
EV_CPU_CYCLES=0x0011        # CPU_CYCLES        周期数，四象限的公共分母
EV_OP_RETIRED=0x003a        # OP_RETIRED        退休的微操作数 → Retiring
EV_OP_SPEC=0x003b           # OP_SPEC           投机执行的微操作数 → BadSpec = OP_SPEC - OP_RETIRED
EV_STALL_SLOT_FE=0x003d     # STALL_SLOT_FRONTEND  前端未供给的 slot → FrontendBound

# ── 后端口径：直接法 or 残差法 ─────────────────────────────────
# EV_STALL_SLOT_BE（STALL_SLOT_BACKEND，架构值 0x003e）**允许留空**。
#
#   填了 = 直接法：BackendBound = STALL_SLOT_BACKEND / (CPU_CYCLES × SLOTS)
#   留空 = 残差法：BackendBound = 1 − (Retiring + BadSpec + FrontendBound)
#
# 为什么会有残差法：不是所有核都实现了独立的 STALL_SLOT_BACKEND 计数器。
# 没实现的核上填了它，perf 会给 <not supported>，而且**整组 {} 都开不起来**
# （组里一个事件无效，整组失败），连另外四个都采不到。这种核只能走残差法。
#
# ⚠️⚠️ 残差法的代价，必须知道：**「四象限求和 ≈ 1」这条自检直接失效。**
#    残差法是拿 1 减出来的，求和**恒等于 1**，永远是个漂亮数字。
#    而那条自检原本是防「SLOTS 取错 / 事件号写错」的主要安全网 ——
#    在残差法下它退化成恒真式，一点判别力都没有。
#    topdown_parse.py 因此在残差法下**不再给求和打 ✅**，改跑下面这组替代校验：
#
#      C1 残差非负     Retiring + BadSpec + FrontendBound ≤ 1
#                      （超了说明 SLOTS 偏小 / 事件号错 / 复用；会反推出最小自洽 SLOTS）
#      C2 投机 ≥ 退休   OP_SPEC ≥ OP_RETIRED（否则 BadSpec 为负，几乎必然是事件号错）
#      C3 退休率封顶   OP_RETIRED / CPU_CYCLES ≤ SLOTS（每周期退休的 op 不可能超过 slot 数）
#      C4 取值域       四个象限都落在 [0, 1]
#      C5 复用检查     最低调度占比 > 99.9%（两种口径下都照跑，不受影响）
#
#    这组能抓到「SLOTS 偏小」「事件号指错」「复用」，但**抓不到「SLOTS 偏大」**：
#    分母放大只会让残差里的 BackendBound 变大，每条不等式反而更宽松。
#    要把这个窟窿补上，唯一的办法是下面的 EV_STALL_SLOT。
#
# 目标核实现了 STALL_SLOT_BACKEND 就填上（直接法信息量更足，求和自检也回来了）；
# 没实现就留空。留空**不是**降级用法，是这颗核的正确用法。
EV_STALL_SLOT_BE=           # STALL_SLOT_BACKEND 架构值 0x003e；留空 = 走残差法

# ── 可选：总停顿 slot 数（残差法下唯一能恢复的真·交叉校验）────
# EV_STALL_SLOT（STALL_SLOT，PMUv3 架构值 0x003f）= 前端+后端合计未利用的 slot 数。
#
# 填了它，topdown_parse.py 会**独立**算一个 backend 出来跟残差法的结果对账：
#     BE_indep = (STALL_SLOT − STALL_SLOT_FRONTEND) / (CPU_CYCLES × SLOTS)
# 两者差超过 0.03 就报 ❌。这条是残差法下**唯一**真正独立的交叉校验 ——
# 它不依赖「1 减出来」的那个恒等式，所以能抓到求和自检本来该抓的那些错，
# 包括残差法抓不到的「SLOTS 偏大」。
#
# 代价是**多占一个通用计数器**（残差法 4 个 → 5 个），余量要重新算，
# 看 probe_pmu.sh 的「计数器余量」一节。
#
# 目标核实现了就填（强烈建议），没实现就留空 —— 留空不影响四象限，只是少一条校验。
EV_STALL_SLOT=              # STALL_SLOT 架构值 0x003f；留空 = 不做这条交叉校验

# ── 可选的额外事件（L2 下钻用）─────────────────────────────────
# 格式："名字=0x00xx 名字2=0x00yy"，名字只能用 [A-Za-z0-9_]（perf 的 name= 限制），
# 事件号同样必须带 0x 前缀（理由见上面「事件号的写法」一节）。
# 这些事件只打印原始计数，不参与四象限计算 —— 加事件不用改代码。
#
# ⚠️ 总事件数**不能超过通用计数器个数**（Neoverse 一般 6 个，watchdog 开着只剩 5 个）。
#    本轮要开几个：
#      残差法 4 个（EV_STALL_SLOT_BE 留空）
#      直接法 5 个（EV_STALL_SLOT_BE 填了）
#      + EV_STALL_SLOT 填了再 +1
#      + EV_EXTRA 每条 +1
#    超了 perf 会开始**复用**（multiplexing）：每个事件只在一部分时间里真正在计数，
#    剩下靠外推。表现是 topdown_parse.py 报的「调度占比」掉到 100% 以下，
#    四象限跟着偏。宁可分两轮采，也不要在一轮里塞满。
#    probe_pmu.sh 会打印本机实际的计数器个数，并把这笔账算给你看。
#
# 例：EV_EXTRA="l1d_cache=0x0004 l1d_cache_refill=0x0003"
EV_EXTRA=

# ── perf 输出格式 ──────────────────────────────────────────────
# auto = 按 perf 版本探测：>= 5.17 有 `-j`（JSON Lines），用它；否则退回 `-x,`（CSV）。
# 优先 JSON 的理由：加了 -G 之后 CSV 会多出一列 cgroup，各版本插入位置还不一样，
# 按列号取值迟早出事（topdown_parse.py 因此一律按 name= 匹配，但 JSON 本身更稳）。
# 可强制写 json / csv 用于排查。
PERF_OUTPUT=auto
