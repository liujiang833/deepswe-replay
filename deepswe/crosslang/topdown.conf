# ARM topdown 采集配置 —— 目标机上**只需要改这一个文件**。
#
# 为什么事件号要放在配置里而不是写进脚本：ARM PMUv3 只把一小部分事件号定为
# 架构必需，其余由各家核自己编号。Neoverse V1 / N2 / 自研核的 TRM 对不上是常态，
# 而事件号写错的表现是「有数、但数是别的东西」，不会报错。把它们隔离在这一个
# 文件里，换核只改配置，脚本一行不动。
#
# 格式约束（bash `source` 与 python 都要能读，所以两边的交集才合法）：
#   - 只写 KEY=VALUE，等号两边不留空格
#   - 值里有空格必须用引号包住（只有 EV_EXTRA 会用到）
#   - 注释用 #，可以整行，也可以跟在值后面
#   - 不要写 shell 展开（$(...) / ${VAR}）—— python 侧不认

# ── PMU ────────────────────────────────────────────────────────
# 留空 = 运行时自动探测：ls /sys/bus/event_source/devices/ | grep -m1 armv8
# 只有在异构核（big.LITTLE，会出现 armv8_pmuv3_0 / armv8_pmuv3_1 多个）
# 或者自动探测选错了的时候才需要手填。probe_pmu.sh 会列出全部候选。
PMU=

# ── SLOTS（每周期的 issue slot 数）─────────────────────────────
# ⚠️ 强烈建议留空。留空 = 运行时从 /sys/bus/event_source/devices/$PMU/caps/slots 读。
#
#    写死一个常数是本套脚本里最危险的一件事：SLOTS 是四象限公式的**公共分母**，
#    V1 是 8、N2 是 5、别的核又不一样。换机器（甚至同机换到另一簇核）之后，
#    分母错了，四个比值会一起按同一个比例静默偏移 —— 每一项看着都还在 0~1 之间，
#    像是「这台机器后端压力大一点」，但其实整套数都是错的，而且**不会报任何错**。
#    唯一的兜底是 topdown_parse.py 的「四象限求和 ≈ 1」自检：分母错了求和就不等于 1，
#    但那时你已经采完一整轮了。
#
#    真要手填，只在 caps/slots 这个文件不存在（老内核没导出）时才填，
#    并且必须以目标核的 TRM 为准，同时盯住求和自检。
SLOTS=

# ── L1 四象限必需的五个事件 ────────────────────────────────────
# 下面是 ARM PMUv3 **架构定义值**，多数 Neoverse 核直接适用；
# 上机前请按目标核 TRM 核对一遍（probe_pmu.sh 的活体验证也能替你兜住大部分错号）。
EV_CPU_CYCLES=0x0011        # CPU_CYCLES        周期数，四象限的公共分母
EV_OP_RETIRED=0x003a        # OP_RETIRED        退休的微操作数 → Retiring
EV_OP_SPEC=0x003b           # OP_SPEC           投机执行的微操作数 → BadSpec = OP_SPEC - OP_RETIRED
EV_STALL_SLOT_FE=0x003d     # STALL_SLOT_FRONTEND  前端未供给的 slot → FrontendBound
EV_STALL_SLOT_BE=0x003e     # STALL_SLOT_BACKEND   后端未接收的 slot → BackendBound

# ── 可选的额外事件（L2 下钻用）─────────────────────────────────
# 格式："名字=0x00xx 名字2=0x00yy"，名字只能用 [A-Za-z0-9_]（perf 的 name= 限制）。
# 这些事件只打印原始计数，不参与四象限计算 —— 加事件不用改代码。
#
# ⚠️ 总事件数（5 + 这里的条数）**不能超过通用计数器个数**（Neoverse 一般 6 个）。
#    超了 perf 会开始**复用**（multiplexing）：每个事件只在一部分时间里真正在计数，
#    剩下靠外推。表现是 topdown_parse.py 报的「调度占比」掉到 100% 以下，
#    四象限求和也会跟着偏。宁可分两轮采，也不要在一轮里塞满。
#    probe_pmu.sh 会打印本机实际的计数器个数。
#
# 例：EV_EXTRA="l1d_cache=0x0004 l1d_cache_refill=0x0003"
EV_EXTRA=

# ── perf 输出格式 ──────────────────────────────────────────────
# auto = 按 perf 版本探测：>= 5.17 有 `-j`（JSON Lines），用它；否则退回 `-x,`（CSV）。
# 优先 JSON 的理由：加了 -G 之后 CSV 会多出一列 cgroup，各版本插入位置还不一样，
# 按列号取值迟早出事（topdown_parse.py 因此一律按 name= 匹配，但 JSON 本身更稳）。
# 可强制写 json / csv 用于排查。
PERF_OUTPUT=auto
